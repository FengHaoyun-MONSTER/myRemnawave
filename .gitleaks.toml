title = "myRemnawave Gitleaks configuration"

[extend]
useDefault = true

# Keep the default generic API-key rule enabled. This exception is deliberately
# constrained to one historical, deterministic unit-test fixture in one file.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Deterministic Machine enrollment unit-test token"
condition = "AND"
regexTarget = "match"
regexes = ['''mrw_enroll_1234567890123456789012345678901234567890''']
paths = ['''^apps/backend/src/modules/machines/machines\.service\.test\.ts$''']
