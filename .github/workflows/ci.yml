name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: remnawave
          POSTGRES_PASSWORD: remnawave_test
          POSTGRES_DB: remnawave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remnawave -d remnawave_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      DATABASE_URL: postgresql://remnawave:remnawave_test@127.0.0.1:5432/remnawave_test
      DIRECT_URL: postgresql://remnawave:remnawave_test@127.0.0.1:5432/remnawave_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  machine-agent:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/machine-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/machine-agent/go.mod
          cache-dependency-path: apps/machine-agent/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/agent
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: sh -n install.sh test-install-debian-13.sh test-install-resume.sh
      - name: Run installer ShellCheck
        run: >-
          docker run --rm
          -v "${PWD}:/mnt:ro"
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          install.sh
          test-install-debian-13.sh
          test-install-resume.sh
      - name: Verify Debian 13 installer support
        run: >-
          docker run --rm
          -v "${PWD}:/mnt:ro"
          debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          sh /mnt/test-install-debian-13.sh /mnt/install.sh
      - name: Verify interrupted-install recovery
        run: >-
          docker run --rm
          -e MYREMNAWAVE_INSTALLER_TEST_CONTAINER=1
          -v "${PWD}:/mnt:ro"
          debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          sh /mnt/test-install-resume.sh /mnt/install.sh

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run cb
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax and installer arguments
        shell: bash
        run: |
          set -euo pipefail
          sh -n deploy/panel/install-panel.sh
          bash -n deploy/panel/test-install-panel.sh
          bash -n deploy/panel/test-machine-control-public-port.sh
          bash -n deploy/panel/deploy.sh
          bash -n deploy/panel/test-deploy-rollback.sh
          sh deploy/panel/install-panel.sh --help 2>&1 | grep -F 'panel-vX.Y.Z'

          invalid_output="$(mktemp)"
          trap 'rm -f "${invalid_output}"' EXIT
          if docker run --rm \
            -v "${PWD}:/mnt:ro" \
            ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea \
            sh /mnt/deploy/panel/install-panel.sh \
            --domain invalid \
            --version panel-v0.1.0 >"${invalid_output}" 2>&1; then
            echo 'Installer accepted an invalid domain.' >&2
            exit 1
          fi
          grep -F 'A valid public panel domain is required.' "${invalid_output}"

          if docker run --rm \
            -v "${PWD}:/mnt:ro" \
            ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea \
            sh /mnt/deploy/panel/install-panel.sh \
            --domain panel.example.com \
            --version latest >"${invalid_output}" 2>&1; then
            echo 'Installer accepted a mutable version.' >&2
            exit 1
          fi
          grep -F 'The version must be an exact panel-vX.Y.Z release.' "${invalid_output}"
      - name: Exercise fresh install safety behavior
        run: >-
          docker run --rm
          -v "${PWD}:/repo:ro"
          ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
          bash -c
          'bash /repo/deploy/panel/test-install-panel.sh && bash /repo/deploy/panel/test-machine-control-public-port.sh'
      - name: Exercise Debian 13 panel installation behavior
        run: >-
          docker run --rm
          -v "${PWD}:/repo:ro"
          debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958
          bash -c
          'bash /repo/deploy/panel/test-install-panel.sh && bash /repo/deploy/panel/test-machine-control-public-port.sh'
      - name: Verify Docker repository distribution detection
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm -v "${PWD}:/repo:ro" ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea bash -c 'source /repo/deploy/panel/deploy.sh; detect_docker_distribution')" = 'ubuntu'
          test "$(docker run --rm -v "${PWD}:/repo:ro" debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958 bash -c 'source /repo/deploy/panel/deploy.sh; detect_docker_distribution')" = 'debian'
      - name: Exercise deployment rollback safety behavior
        run: bash deploy/panel/test-deploy-rollback.sh
      - name: Run ShellCheck
        run: >-
          docker run --rm
          -v "${PWD}:/mnt:ro"
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          deploy/panel/install-panel.sh
          deploy/panel/test-install-panel.sh
          deploy/panel/test-machine-control-public-port.sh
          deploy/panel/deploy.sh
          deploy/panel/test-deploy-rollback.sh
      - name: Run actionlint
        run: >-
          docker run --rm
          -v "${PWD}:/repo:ro"
          -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
