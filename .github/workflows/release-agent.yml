name: Release Machine Agent

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/machine-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/machine-agent/go.mod
          cache-dependency-path: apps/machine-agent/go.sum
      - name: Test
        run: |
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
          sh -n install.sh test-install-debian-13.sh test-install-resume.sh
          docker run --rm \
            -v "${PWD}:/mnt:ro" \
            debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958 \
            sh /mnt/test-install-debian-13.sh /mnt/install.sh
          docker run --rm \
            -e MYREMNAWAVE_INSTALLER_TEST_CONTAINER=1 \
            -v "${PWD}:/mnt:ro" \
            debian:13@sha256:34cd9e9fd437c0a095ec39cb2e73422c9f30821b0d0848ed74fd0d43bae4d958 \
            sh /mnt/test-install-resume.sh /mnt/install.sh
      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o myremnawave-agent-linux-amd64 ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o myremnawave-agent-linux-arm64 ./cmd/agent
          cp packaging/systemd/myremnawave-agent.service .
          sha256sum myremnawave-agent-linux-amd64 myremnawave-agent-linux-arm64 myremnawave-agent.service > SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          myremnawave-agent-linux-amd64
          myremnawave-agent-linux-arm64
          myremnawave-agent.service
          SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
