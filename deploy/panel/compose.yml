name: myremnawave

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "3"

services:
  panel:
    <<: *service-defaults
    image: myremnawave-panel:${PANEL_IMAGE_TAG:?PANEL_IMAGE_TAG is required}
    container_name: myremnawave-panel
    hostname: panel
    env_file:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/.env
    ports:
      - target: 3010
        published: "${MACHINE_CONTROL_PUBLIC_PORT:-3010}"
        protocol: tcp
    volumes:
      - valkey-socket:/var/run/valkey
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://127.0.0.1:$${METRICS_PORT:-3001}/health >/dev/null
          && curl --fail --silent
          --header 'X-Forwarded-For: 127.0.0.1'
          --header 'X-Forwarded-Proto: https'
          http://127.0.0.1:$${APP_PORT:-3000}/ >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  database:
    <<: *service-defaults
    image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    container_name: myremnawave-database
    hostname: database
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      TZ: UTC
    volumes:
      - database-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    <<: *service-defaults
    image: valkey/valkey:9.1.1-alpine3.24@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    container_name: myremnawave-valkey
    hostname: valkey
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
      - --loglevel
      - warning
      - --unixsocket
      - /var/run/valkey/valkey.sock
      - --unixsocketperm
      - "777"
      - --port
      - "0"
    volumes:
      - valkey-socket:/var/run/valkey
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/var/run/valkey/valkey.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: myremnawave-caddy
    hostname: caddy
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
    ports:
      - target: 80
        published: "80"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: tcp
      - target: 443
        published: "443"
        protocol: udp
    volumes:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal
    depends_on:
      panel:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  internal:
    name: myremnawave-internal
    driver: bridge

volumes:
  database-data:
    name: myremnawave-database-data
  valkey-socket:
    name: myremnawave-valkey-socket
  caddy-data:
    name: myremnawave-caddy-data
  caddy-config:
    name: myremnawave-caddy-config
